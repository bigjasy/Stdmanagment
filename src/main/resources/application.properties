spring.application.name=studentmanagement
server.port=8080

# XAMPP MySQL defaults: user root, empty password, port 3306.
spring.datasource.url=jdbc:mysql://localhost:3306/studentmanagement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# External exam service (Change 6). Writes fail with 503 when it is down; reads use the local mirror.
external.exams.base-url=http://localhost:9090
external.exams.connect-timeout=2s
external.exams.read-timeout=3s

# Academic is a logical name. Change the host or port here, not in RegistrationService.
# Registration tries these instances in turn. The public API stays on port 8080.
discovery.services.academic[0]=http://localhost:8082
discovery.services.academic[1]=http://localhost:8083
