name: Tests

on:
  push:
    branches:
      - main
      - change-1
      - change-2
      - change-3
      - change-4
      - change-5
      - change-6
      - change-7
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B test
